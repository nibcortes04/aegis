name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system test dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy jq libnotify-bin

      - name: Syntax check
        run: |
          python3 -m py_compile scripts/*.py tests/*.py mcp/*.py install.py
          bash -n scripts/*.sh tests/*.sh install.sh uninstall.sh

      - name: Run Test Suites
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v
          ./tests/test_hooks.sh

  deploy:
    name: Deploy Docs to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
