name: Autonomous Bot PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "dev", "main" ]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  bot-gate-audit:
    name: 🤖 Autonomous Bot Certification & Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Utilities
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy jq libnotify-bin

      - name: Run Autonomous Bot Pre-Flight Gate (bot_pr_check.py)
        run: |
          python3 scripts/bot_pr_check.py

      - name: Apply Bot Verification Label & Post Review Report
        if: startsWith(github.head_ref, 'bot/') || contains(github.event.pull_request.labels.*.name, 'bot')
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;
            
            // Add label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['bot-verified', 'bot-pr']
              });
            } catch (err) {
              console.log('Label notice:', err.message);
            }

            // Post structured audit report
            const commentBody = `### 🤖 Aegis Autonomous Quality Gate Report
            
**Status**: 🟢 **PASSED — CERTIFIED FOR MERGE**  
**Branch**: \`${branch}\`  
**Verification Checklist**:
- [x] **Git Worktree Hygiene**: No stray cache, credentials, or untracked debris.
- [x] **Manifest Conformance**: \`plugin.json\` schema & packaging integrity verified (\`package_plugin.py --dry-run\`).
- [x] **Unit Test Suite**: 100% pass rate achieved across all test modules.
- [x] **Lifecycle Hook Contracts**: Sub-10ms hooks (PreToolUse, Stop, 2FA Gate) verified.

*Autonomous gate approval granted. Ready for merge into \`dev\`.*`;

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            } catch (err) {
              console.log('Comment notice:', err.message);
            }
