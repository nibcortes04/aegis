<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="aegis-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="aegis-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="aegis-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="aegis-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <path d="M32 4 L54 14 L50 40 L32 58 L14 40 L10 14 Z" 
        fill="url(#aegis-shield-grad)" 
        opacity="0.25" 
        filter="url(#aegis-blur)" />

  <!-- Main Shield Body -->
  <path d="M32 6 L52 15 L48 39 L32 56 L16 39 L12 15 Z" 
        fill="#0a0f1d" 
        stroke="url(#aegis-shield-grad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Faceted Geometry -->
  <path d="M32 10 L46 17 L43 36 L32 50 L21 36 L18 17 Z" 
        fill="url(#aegis-shield-grad)" 
        fill-opacity="0.12" 
        stroke="url(#aegis-shield-grad)" 
        stroke-width="1.2" 
        stroke-opacity="0.6" 
        stroke-linejoin="round" />

  <!-- Upper Specular Highlight -->
  <path d="M32 8 L50 16 L46 24 L32 18 L18 24 L14 16 Z" 
        fill="url(#aegis-glow)" />

  <!-- Central High-Tech Chevron / Core Node -->
  <path d="M32 19 L40 28 L32 37 L24 28 Z" 
        fill="url(#aegis-core-grad)" 
        stroke="#00f0ff" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Center Energy Core -->
  <circle cx="32" cy="28" r="3.2" fill="#ffffff" />
  <circle cx="32" cy="28" r="1.5" fill="#00f0ff" />

  <!-- Terminal Indicator Notch -->
  <line x1="32" y1="40" x2="32" y2="47" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
</svg>
